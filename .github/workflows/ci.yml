name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: gomlang/workflows/.github/workflows/ecosystem-ci.yml@bf6d97bd6e544d5fa7a7c4d5a7aac316637daf59
    with:
      module: notify
      workflows-ref: bf6d97bd6e544d5fa7a7c4d5a7aac316637daf59
